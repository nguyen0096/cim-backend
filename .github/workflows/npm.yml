name: NPM Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  npm_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ">=1.22"

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Install protobuf tools
        run: make proto-install

      - name: Lint proto files
        run: buf lint

      - name: Generate proto files
        run: buf generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://npm.pkg.github.com"

      - name: Update package version and publish
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RELEASE_TOKEN }}
        run: |
          # Try to get the latest published version from GitHub Packages
          PUBLISHED_VERSION=$(npm view @HN-corp/cim-backend@latest version --registry=https://npm.pkg.github.com 2>/dev/null || echo "")

          echo "Latest published version: $PUBLISHED_VERSION"

          # Increment patch version
          IFS='.' read -ra VERSION_PARTS <<< "$PUBLISHED_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          echo "final_publishing_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Final publishing version: $VERSION"

          cd ./protogenes
          npm version $VERSION --no-git-tag-version
          npm publish
