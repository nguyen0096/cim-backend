name: Release

# Builds, tests, and publishes a release: pushes the Docker image and creates a
# Git tag + GitHub Release with detailed notes (PRs, migrations, caveats).
#
# This workflow does NOT deploy. To roll out a release to production, run the
# separate "Deploy to Production (Dokploy)" workflow with the tag created here.

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hn-corp/cim-backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go with cache and code generation
        uses: ./.github/actions/setup-go-with-cache

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m
          skip-cache: false
          skip-save-cache: false

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go with cache and code generation
        uses: ./.github/actions/setup-go-with-cache

      - name: Run tests
        run: make test

  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [lint, test]  # Only runs if both lint and test pass
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate new version
        id: version
        run: |
          # Fetch all tags
          git fetch --tags

          # Get the latest tag matching semantic versioning pattern
          LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)

          # If no tags exist, start with v0.1.0
          if [ -z "$LATEST_TAG" ]; then
            if [ "${{ github.event.inputs.version_bump }}" == "major" ]; then
              NEW_VERSION="v1.0.0"
            else
              NEW_VERSION="v0.1.0"
            fi
          else
            # Remove 'v' prefix and split version
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # Increment based on input
            case "${{ github.event.inputs.version_bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "New version will be: $NEW_VERSION (previous: ${LATEST_TAG:-none})"

      - name: Detect new migrations
        id: migrations
        run: |
          PREV="${{ steps.version.outputs.latest_tag }}"

          if [ -n "$PREV" ]; then
            # Newly ADDED up-migrations since the previous tag.
            NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A "${PREV}..HEAD" -- database/migrations/ \
              | grep '\.up\.sql$' | sort || true)
          else
            # First release (no previous tag): every tracked up-migration ships now.
            NEW_MIGRATIONS=$(git ls-files -- 'database/migrations/*.up.sql' | sort || true)
          fi

          {
            echo "migrations<<MIGRATIONS_EOF"
            if [ -z "$NEW_MIGRATIONS" ]; then
              echo "_No new migrations in this release._"
            else
              COUNT=$(echo "$NEW_MIGRATIONS" | wc -l | tr -d ' ')
              echo "⚠️ **$COUNT new migration(s) to be executed:**"
              echo ""
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                echo "- \`$(basename "$f")\`"
              done <<< "$NEW_MIGRATIONS"
            fi
            echo "MIGRATIONS_EOF"
          } >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: |
            type=gha,scope=production-build
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=gha,mode=max,scope=production-build
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable

      - name: Print Docker images
        run: |
          echo "🐳 Docker images built and pushed:"
          echo "  📦 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_version }}"
          echo "  📦 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable"

      - name: Create and push Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.new_version }} -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: Release ${{ steps.version.outputs.new_version }}
          # GitHub appends an auto-generated "## What's Changed" PR list below this body.
          generate_release_notes: true
          body: |
            Production release ${{ steps.version.outputs.new_version }}

            **Version bump:** ${{ github.event.inputs.version_bump }}
            **Docker image:** `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_version }}`

            ## Migrations
            ${{ steps.migrations.outputs.migrations }}
          draft: false
          prerelease: false
