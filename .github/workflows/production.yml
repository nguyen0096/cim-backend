name: Production Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hn-corp/cim-backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Install code generation tools
        run: |
          go install golang.org/x/tools/cmd/stringer@latest
          go install github.com/vektra/mockery/v2@latest

      - name: Generate mocks
        run: make generate

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Install dependencies
        run: go mod download

      - name: Install code generation tools
        run: |
          go install golang.org/x/tools/cmd/stringer@latest
          go install github.com/vektra/mockery/v2@latest

      - name: Generate mocks
        run: make generate

      - name: Run tests
        run: make test

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-v2-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v2-
      - name: Install dependencies
        run: go mod download

      - name: Install tools
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo
          go install golang.org/x/tools/cmd/stringer@latest
          go install github.com/vektra/mockery/v2@latest

      - name: Generate mocks
        run: make generate
        
      - name: Run integration tests
        run: |
          ginkgo -r -p -race -tags=integration ./test/...

  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [lint, test]  # Only runs if both lint and test pass
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate new version
        id: version
        run: |
          # Fetch all tags
          git fetch --tags
          
          # Get the latest tag matching semantic versioning pattern
          LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
          
          # If no tags exist, start with v0.1.0
          if [ -z "$LATEST_TAG" ]; then
            if [ "${{ github.event.inputs.version_bump }}" == "major" ]; then
              NEW_VERSION="v1.0.0"
            else
              NEW_VERSION="v0.1.0"
            fi
          else
            # Remove 'v' prefix and split version
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            
            # Increment based on input
            case "${{ github.event.inputs.version_bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version will be: $NEW_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable

      - name: Print Docker images
        run: |
          echo "🐳 Docker images built and pushed:"
          echo "  📦 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_version }}"
          echo "  📦 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable"

      - name: Update Dokploy Docker image
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_DOMAIN: ${{ vars.DOKPLOY_DOMAIN }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
        run: |
          curl -X POST "https://$DOKPLOY_DOMAIN/api/application.saveDockerProvider" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{
              \"dockerImage\": \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_version }}\",
              \"applicationId\": \"$DOKPLOY_APPLICATION_ID\"
            }"

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_DOMAIN: ${{ vars.DOKPLOY_DOMAIN }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
        run: |
          curl -X POST "https://$DOKPLOY_DOMAIN/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{
              \"applicationId\": \"$DOKPLOY_APPLICATION_ID\"
            }"

      - name: Create and push Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.new_version }} -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          release_name: Release ${{ steps.version.outputs.new_version }}
          body: |
            Production release ${{ steps.version.outputs.new_version }}
            
            **Version bump type:** ${{ github.event.inputs.version_bump }}
            **Docker image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_version }}
          draft: false
          prerelease: false

