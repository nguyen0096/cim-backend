basePath: /api/v1
definitions:
  dto.UpdatePurchaseOrderDeliveryStatusRequest:
    properties:
      items:
        items:
          properties:
            id:
              type: integer
            received_quantity:
              minimum: 1
              type: integer
          required:
          - id
          - received_quantity
          type: object
        minItems: 1
        type: array
      purchase_order_id:
        type: integer
    required:
    - items
    - purchase_order_id
    type: object
  models.GetSettingsResponse:
    description: Response containing all application settings
    properties:
      data:
        items:
          $ref: '#/definitions/models.Settings'
        type: array
    type: object
  models.Inventory:
    type: object
  models.InventoryItem:
    type: object
  models.Product:
    type: object
  models.PurchaseOrder:
    type: object
  models.PurchaseOrderItemStatus:
    enum:
    - delivering
    - delivered
    type: string
    x-enum-varnames:
    - PurchaseOrderItemStatusDelivering
    - PurchaseOrderItemStatusDelivered
  models.PurchaseOrderStatus:
    enum:
    - order_placed
    - partially_delivered
    - fully_delivered
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - PurchaseOrderStatusOrderPlaced
    - PurchaseOrderStatusPartiallyDelivered
    - PurchaseOrderStatusFullyDelivered
    - PurchaseOrderStatusCompleted
    - PurchaseOrderStatusCancelled
  models.SetSettingResponse:
    description: Response after successfully setting a configuration value
    properties:
      message:
        example: Setting updated successfully
        type: string
    type: object
  models.Settings:
    properties:
      key:
        example: app_name
        type: string
      value:
        type: object
    type: object
  models.UpdatePurchaseOrderItemStatusResponse:
    properties:
      item_status:
        allOf:
        - $ref: '#/definitions/models.PurchaseOrderItemStatus'
        example: delivered
      order_status:
        allOf:
        - $ref: '#/definitions/models.PurchaseOrderStatus'
        example: fully_delivered
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is an Import Export Backend API server for managing products,
    inventory, suppliers, and orders.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Import Export Backend API
  version: "1.0"
paths:
  /api/purchase-orders:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of purchase orders with optional search,
        sorting, and date range filtering
      parameters:
      - description: 'Page number (default: 1, minimum: 1)'
        in: query
        name: page
        type: integer
      - description: 'Number of items per page (default: 20, minimum: 1, maximum:
          100)'
        in: query
        name: limit
        type: integer
      - description: Search term for order number or notes
        in: query
        name: q
        type: string
      - description: Sort field (order_number, status, total_amount, created_at, updated_at)
        in: query
        name: sort
        type: string
      - description: 'Sort direction (asc, desc, default: asc)'
        in: query
        name: order
        type: string
      - description: 'Start date for filtering (format: YYYY-MM-DD)'
        in: query
        name: start_date
        type: string
      - description: 'End date for filtering (format: YYYY-MM-DD)'
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved purchase orders
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch purchase orders
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List purchase orders
      tags:
      - purchase-orders
      'x-codegen-max-depth:': 2
    post:
      consumes:
      - application/json
      description: Create a new purchase order with the provided details
      parameters:
      - description: Purchase order data
        in: body
        name: purchase_order
        required: true
        schema:
          $ref: '#/definitions/models.PurchaseOrder'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created purchase order
          schema:
            $ref: '#/definitions/models.PurchaseOrder'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to create purchase order
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new purchase order
      tags:
      - purchase-orders
  /api/purchase-orders/{id}/items/{item_id}/status:
    put:
      consumes:
      - application/json
      description: Update the status of a specific item in a purchase order
      parameters:
      - description: Purchase Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Purchase Order Item ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: Status update request
        in: body
        name: status
        required: true
        schema:
          properties:
            status:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated purchase order item status
          schema:
            $ref: '#/definitions/models.UpdatePurchaseOrderItemStatusResponse'
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties:
