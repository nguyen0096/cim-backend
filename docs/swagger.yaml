host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is an Import Export Backend API server for managing products,
    inventory, suppliers, and orders.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Import Export Backend API
  version: "1.0"
paths:
  /api/purchase-orders:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of purchase orders with optional search,
        sorting, and date range filtering
      parameters:
      - description: 'Page number (default: 1, minimum: 1)'
        in: query
        name: page
        type: integer
      - description: 'Number of items per page (default: 20, minimum: 1, maximum:
          100)'
        in: query
        name: limit
        type: integer
      - description: Search term for order number, notes, or supplier name
        in: query
        name: q
        type: string
      - description: Sort field (order_number, status, total_amount, created_at, updated_at)
        in: query
        name: sort
        type: string
      - description: 'Sort direction (asc, desc, default: asc)'
        in: query
        name: order
        type: string
      - description: 'Start date for filtering (format: YYYY-MM-DD)'
        in: query
        name: start_date
        type: string
      - description: 'End date for filtering (format: YYYY-MM-DD)'
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved purchase orders
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch purchase orders
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List purchase orders
      tags:
      - purchase-orders
    post:
      consumes:
      - application/json
      description: Create a new purchase order with the provided details
      parameters:
      - description: Purchase order data
        in: body
        name: purchase_order
        required: true
        schema:
          $ref: '#/definitions/models.PurchaseOrder'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created purchase order
          schema:
            $ref: '#/definitions/models.PurchaseOrder'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to create purchase order
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new purchase order
      tags:
      - purchase-orders
  /api/purchase-orders/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a purchase order by its ID with all related items and
        relationships
      parameters:
      - description: Purchase Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved purchase order
          schema:
            $ref: '#/definitions/models.PurchaseOrder'
        "400":
          description: Invalid purchase order ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Purchase order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to get purchase order
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get purchase order by ID
      tags:
      - purchase-orders
    put:
      consumes:
      - application/json
      description: Update a purchase order's inventory, notes, and items while preserving
        received quantities
      parameters:
      - description: Purchase Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Purchase order update data
        in: body
        name: purchase_order
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePurchaseOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated purchase order
          schema:
            $ref: '#/definitions/models.PurchaseOrder'
        "400":
          description: Invalid request body or validation failed
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Purchase order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Cannot edit completed or cancelled purchase order
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to update purchase order
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a purchase order
      tags:
      - purchase-orders
  /api/purchase-orders/{id}/items/{item_id}/status:
    put:
      consumes:
      - application/json
      description: Update the status of a specific item in a purchase order
      parameters:
      - description: Purchase Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Purchase Order Item ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: Status update request
        in: body
        name: status
        required: true
        schema:
          properties:
            status:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated purchase order item status
          schema:
            $ref: '#/definitions/dto.UpdatePurchaseOrderItemStatusResponse'
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Purchase order or item not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to update purchase order item status
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update purchase order item status
      tags:
      - purchase-orders
  /api/purchase-orders/delivery-status:
    put:
      consumes:
      - application/json
      description: Update the delivery status of purchase order items by recording
        received quantities
      parameters:
      - description: Delivery status update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePurchaseOrderDeliveryStatusRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Successfully updated purchase order delivery status
        "400":
          description: Invalid request body or validation failed
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Purchase order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to update purchase order delivery status
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update purchase order delivery status
      tags:
      - purchase-orders
  /api/v1/purchase-orders/revenue-expense/{payment_receipt_form_id}/retry:
    post:
      consumes:
      - application/json
      description: Retry queueing a revenue expense request for a payment receipt
        form
      parameters:
      - description: Payment Receipt Form ID
        in: path
        name: payment_receipt_form_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully queued revenue expense request
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid payment receipt form ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Payment receipt form not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to queue revenue expense request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Retry queue revenue expense request
      tags:
      - purchase-orders
  /excel/verify:
    post:
      consumes:
      - application/json
      description: Verifies that the specified file (local Excel or Google Sheets
        URL) and sheetname exist and are valid
      parameters:
      - description: File verification request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Verification successful
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: File or sheet not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify file and sheet
      tags:
      - excel
  /inventories:
    get:
      consumes:
      - application/json
      description: List all inventories with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List inventories
      tags:
      - inventories
    post:
      consumes:
      - application/json
      description: Create a new inventory
      parameters:
      - description: Inventory data
        in: body
        name: inventory
        required: true
        schema:
          $ref: '#/definitions/models.Inventory'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Inventory'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create inventory
      tags:
      - inventories
