syntax = "proto3";

package services;

option go_package = "cim-backend/proto/services";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// UserService provides user management operations
service UserService {
  // Get current user permissions
  rpc GetUserPermissions(google.protobuf.Empty) returns (UserPermissionsResponse);
}

// UserPermissionsResponse represents response with user permissions
message UserPermissionsResponse {
  google.protobuf.Struct permissions = 1;
}
