syntax = "proto3";

package services;

option go_package = "cim-backend/proto/services";

import "common/common.proto";
import "models/all_models.proto";

// ProductService provides product management operations
service ProductService {
  // List all products with pagination and filtering
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);

  // Create a new product
  rpc CreateProduct(CreateProductRequest) returns (models.Product);

  // Search products
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse);

  // Update product status
  rpc UpdateProductStatus(UpdateProductStatusRequest) returns (UpdateProductStatusResponse);

  // Import products from CSV
  rpc ImportProductsFromCSV(ImportProductsRequest) returns (ImportProductsResponse);
}

// ListProductsRequest represents request to list products
message ListProductsRequest {
  common.ListParams params = 1;
}

// ListProductsResponse represents response with list of products
message ListProductsResponse {
  repeated models.Product data = 1;
  common.PaginationResult pagination = 2;
}

// CreateProductRequest represents request to create a product
message CreateProductRequest {
  models.Product product = 1;
}

// SearchProductsRequest represents request to search products
message SearchProductsRequest {
  string query = 1;
  common.ListParams params = 2;
}

// SearchProductsResponse represents response with search results
message SearchProductsResponse {
  repeated models.Product data = 1;
  common.PaginationResult pagination = 2;
}

// UpdateProductStatusRequest represents request to update product status
message UpdateProductStatusRequest {
  uint32 id = 1;
  string status = 2;
}

// UpdateProductStatusResponse represents response after updating status
message UpdateProductStatusResponse {
  string message = 1;
}

// ImportProductsRequest represents request to import products from CSV
message ImportProductsRequest {
  bytes file_content = 1;
  string file_name = 2;
}

// ImportProductsResponse represents response after importing products
message ImportProductsResponse {
  int32 products_imported = 1;
  int32 suppliers_imported = 2;
  string message = 3;
}
