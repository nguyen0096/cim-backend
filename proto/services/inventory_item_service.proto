syntax = "proto3";

package services;

option go_package = "cim-backend/proto/services";

import "common/common.proto";
import "models/product.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// InventoryItemService provides inventory item management operations
service InventoryItemService {
  // List all inventory items with pagination
  rpc ListInventoryItems(ListInventoryItemsRequest) returns (ListInventoryItemsResponse);

  // Get inventory items by inventory ID
  rpc GetInventoryItemsByInventoryID(GetInventoryItemsByInventoryIDRequest) returns (GetInventoryItemsResponse);

  // Get an inventory item by ID
  rpc GetInventoryItem(GetInventoryItemRequest) returns (models.InventoryItem);

  // Get inventory item by product ID
  rpc GetInventoryItemByProductID(GetInventoryItemByProductIDRequest) returns (models.InventoryItem);

  // Create a new inventory item
  rpc CreateInventoryItem(CreateInventoryItemRequest) returns (models.InventoryItem);

  // Update an inventory item
  rpc UpdateInventoryItem(UpdateInventoryItemRequest) returns (models.InventoryItem);

  // Delete an inventory item
  rpc DeleteInventoryItem(DeleteInventoryItemRequest) returns (google.protobuf.Empty);

  // Adjust inventory item quantity
  rpc AdjustInventoryItemQuantity(AdjustInventoryItemQuantityRequest) returns (models.InventoryItem);

  // Get low stock items
  rpc GetLowStockItems(GetLowStockItemsRequest) returns (GetLowStockItemsResponse);
}

// ListInventoryItemsRequest represents request to list inventory items
message ListInventoryItemsRequest {
  common.ListParams params = 1;
}

// ListInventoryItemsResponse represents response with list of inventory items
message ListInventoryItemsResponse {
  repeated models.InventoryItem data = 1;
  common.PaginationResult pagination = 2;
}

// GetInventoryItemsByInventoryIDRequest represents request to get items by inventory ID
message GetInventoryItemsByInventoryIDRequest {
  uint32 inventory_id = 1;
  common.ListParams params = 2;
  string product_type = 3;
}

// GetInventoryItemsResponse represents response with inventory items
message GetInventoryItemsResponse {
  repeated models.InventoryItem data = 1;
  common.PaginationResult pagination = 2;
}

// GetInventoryItemRequest represents request to get an inventory item by ID
message GetInventoryItemRequest {
  uint32 inventory_id = 1;
  uint32 item_id = 2;
}

// GetInventoryItemByProductIDRequest represents request to get item by product ID
message GetInventoryItemByProductIDRequest {
  uint32 product_id = 1;
}

// CreateInventoryItemRequest represents request to create an inventory item
message CreateInventoryItemRequest {
  uint32 inventory_id = 1;
  models.InventoryItem inventory_item = 2;
}

// UpdateInventoryItemRequest represents request to update an inventory item
message UpdateInventoryItemRequest {
  uint32 inventory_id = 1;
  uint32 item_id = 2;
  models.InventoryItem inventory_item = 3;
}

// DeleteInventoryItemRequest represents request to delete an inventory item
message DeleteInventoryItemRequest {
  uint32 inventory_id = 1;
  uint32 item_id = 2;
}

// AdjustInventoryItemQuantityRequest represents request to adjust quantity
message AdjustInventoryItemQuantityRequest {
  uint32 inventory_id = 1;
  uint32 item_id = 2;
  google.protobuf.Struct adjustment = 3;
}

// GetLowStockItemsRequest represents request to get low stock items
message GetLowStockItemsRequest {
  common.ListParams params = 1;
}

// GetLowStockItemsResponse represents response with low stock items
message GetLowStockItemsResponse {
  repeated models.InventoryItem data = 1;
  common.PaginationResult pagination = 2;
}
