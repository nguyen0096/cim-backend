syntax = "proto3";

package models;

option go_package = "cim-backend/proto/models";

import "common/common.proto";

// Product represents a product
message Product {
  common.Base base = 1;
  string name = 2;
  string description = 3;
  string product_type = 4;
  string unit = 5;
  string status = 6;
  repeated Supplier suppliers = 7;
  repeated InventoryItem inventory_items = 8;
}

// Supplier represents a supplier
message Supplier {
  common.Base base = 1;
  string name = 2;
  string contact_email = 3;
  string contact_phone = 4;
  string address = 5;
  string status = 6;
  repeated Product products = 7;
}

// InventoryItem represents an item in an inventory
message InventoryItem {
  common.Base base = 1;
  uint32 inventory_id = 2;
  Inventory inventory = 3;
  uint32 product_id = 4;
  Product product = 5;
  uint32 supplier_id = 6;
  Supplier supplier = 7;
  string unit = 8;
  int32 quantity = 9;
  string status = 10;
  uint32 consuming_transaction_id = 11;
  repeated InventoryTransaction active_purchase_transactions = 12;
}

// Inventory represents a warehouse or storage location
message Inventory {
  common.Base base = 1;
  string name = 2;
  string description = 3;
  string location = 4;
  string status = 5;
  repeated InventoryItem items = 6;
}

// InventoryTransaction represents an inventory transaction
message InventoryTransaction {
  common.Base base = 1;
  uint32 inventory_item_id = 2;
  InventoryItem inventory_item = 3;
  string transaction_type = 4;
  double price = 5;
  int32 quantity = 6;
  int32 consumed_quantity = 7;
  uint32 counter_transaction_id = 8;
  uint32 purchase_order_item_id = 9;
}
